---
# Sample CAP no BTP CF com os logs indo ao Datadog pelo buildpack oficial (supply), listado antes do nodejs_buildpack.
# DD_API_KEY não fica aqui: scripts/deploy.sh grava com cf set-env (o cf push mantém as variáveis fora do manifest).
# Vars (scripts/deploy.sh as passa a partir do .env): dd_site, dd_env.
applications:
  - name: datadog-backend-sample
    random-route: true
    # Medido no trial (13/10): ~96 MB de memória e 315 MB de disco (droplet com Node + binários do agente).
    memory: 256M
    disk_quota: 512M
    instances: 1
    stack: cflinuxfs4
    health-check-type: http
    health-check-http-endpoint: /health
    buildpacks:
      - https://github.com/DataDog/datadog-cloudfoundry-buildpack/releases/download/4.48.1/datadog-cloudfoundry-buildpack-4.48.1.zip
      - nodejs_buildpack
    env:
      NODE_ENV: production
      DD_SITE: ((dd_site))
      DD_ENV: ((dd_env))
      DD_SERVICE: datadog-backend-sample
      # O buildpack junta a estas as tags do CF (application_name, space_name, instance_index, uri, container_id).
      DD_TAGS: env:((dd_env)),platform:sap-btp-cf
      DD_LOGS_ENABLED: true
      DD_ENABLE_CHECKS: false
      # Saída do agente no cf logs, para diagnóstico (erros de envio, endpoint usado).
      SUPPRESS_DD_AGENT_OUTPUT: false
      # Só o log de rota vai ao Datadog: o app escreve cada linha direto na porta TCP do agente (LOGS_CONFIG).
      # Sem STD_LOG_COLLECTION_PORT, o stdout (start do CAP, npm, buildpack) fica só no cf logs.
      # Se um dia voltar a mandar o stdout: não use DD_SPARSE_APP_LOGS (o scripts/nc.rb do buildpack quebra com o
      # Ruby 3.0 do cflinuxfs4 do BTP, "must be called with a block (ThreadError)", e nada chega ao agente).
      ACCESS_LOG_TCP_PORT: 10514
      LOGS_CONFIG: '[{"type":"tcp","port":10514,"source":"nodejs","service":"datadog-backend-sample"}]'
